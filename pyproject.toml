[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-tree-model"
version = "0.1.0"
description = "A clean, round-aware decision-tree research platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "jsonschema>=4.23",
  "pyyaml>=6.0",
]

[project.scripts]
dtm = "decision_tree_model.cli:entrypoint"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff",
  "mypy",
  "types-jsonschema",
  "types-PyYAML",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["decision_tree_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
