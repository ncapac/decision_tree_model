name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Format
        run: python -m ruff format --check src tests

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy src

      - name: Test contracts and hashes
        run: python -m pytest

      - name: Validate pending round
        run: python -m decision_tree_model validate-round --round round_000

      - name: Rebuild indexes
        run: python -m decision_tree_model build-index

      - name: Verify generated indexes are current
        run: git diff --exit-code -- data/catalog/index.json results/index.json
